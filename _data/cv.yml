    - title: Researcher
      institution: Samsung R&D Institute Bangladesh
      year: 2024 - Present
      location: Dhaka, Bangladesh
      description:
        - title: "<b>On-Device AI</b>"
          contents:
            - "Led a team of 4 researchers on R&D of on-device super-resolution models. Secured Advanced Research Fund (ARF) from Samsung Research for further super-resolution research and patentable solutions."
            - "Developed the proof-of-concept AI model in PyTorch for a patented camera/AI solution. Profiled the performance of the model on consumer mobile devices to identify memory and compute bottlenecks. Reduced model size by 70% and on-device inference time from 58s to 8s using MobileNet feature extractors, sparsity pruning and mixed precision quantization."
            - "Built native context offloading libraries for GalaxyClaw, accelerating on-device agentic AI inference while reducing memory overhead."
        - title: "<b>SRBD AI Infrastructure</b>"
          contents:
            - "Built and deployed internal GPU clustering over distributed GPUs within the intra-network using C and CUDA Toolkit. Profiled performance of Fully Sharded Data Parallel (FSDP) and pipeline parallelism for distributed LLM training."
            - "Implemented custom network communication and pipeline parallelism for training and serving LLMs across multiple network-connected GPUs, supporting over 500 internal users using C."
            - "Architected and implemented a dynamic routing mechanism based on request type for efficient expert selection, offloading, and loading in Mixture-of-Experts (MoE) LLM inference."
            - "Developed a Google Colab-like GPU allocation system with a web interface for internal AI model training using shared GPU compute."

    - title: Undergraduate Thesis
      institution: Dept. of Computer Science and Engineering, University of Dhaka
      year: Jan. 2024
      location: Dhaka, Bangladesh
      description:
        - "Identified a research gap in literature that only addressed node features for VRP without accounting for variable edge cost."
        - "Implemented two graph convolution based encoders: an edge encoder and a node encoder designed to extract features in graphs with variable-cost edges using PyTorch."
        - "Implemented a multi-headed attention transformer with a Graph Attention Network (GAT) architecture to aggregate edge and node features."
        - "Integrated the REINFORCE algorithm to learn policies that minimize routing cost, trained on 10k Vehicle Routing Problem (VRP) instances."

